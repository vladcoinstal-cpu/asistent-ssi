name: Build Photo Viewer APK
on:
  push:
    branches:
      - build/photo-viewer-apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build release APK
        working-directory: apk-build/photo-viewer
        run: gradle :app:assembleRelease --stacktrace
      - name: Restore previous release signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous-signing"
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9577499379/zip" \
            -o "$RUNNER_TEMP/previous-signing.zip"
          unzip -q "$RUNNER_TEMP/previous-signing.zip" -d "$RUNNER_TEMP/previous-signing"
          test -f "$RUNNER_TEMP/previous-signing/iadulascultarii-release-key.p12"
          test -f "$RUNNER_TEMP/previous-signing/SIGNING-KEY-IMPORTANT.txt"
      - name: Align sign v1 v2 v3 and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output
          KEYSTORE="$RUNNER_TEMP/previous-signing/iadulascultarii-release-key.p12"
          INFO="$RUNNER_TEMP/previous-signing/SIGNING-KEY-IMPORTANT.txt"
          PASS="$(grep -m1 '^Keystore password:' "$INFO" | sed 's/^Keystore password: //')"
          test -n "$PASS"
          OUT="ci-output/GalerieFotoAnimata-COM-VLADCOINSTAL-APKPURE-2.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            apk-build/photo-viewer/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/GalerieFotoAnimata-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias iadulascultarii \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$OUT" \
            "$RUNNER_TEMP/GalerieFotoAnimata-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee ci-output/APK_VERIFY.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' ci-output/APK_VERIFY.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' ci-output/APK_VERIFY.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' ci-output/APK_VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$OUT" | tee ci-output/APK_BADGING.txt
          grep -q "package: name='com.vladcoinstal.galeriefotoanimata'" ci-output/APK_BADGING.txt
          cp "$KEYSTORE" ci-output/iadulascultarii-release-key.p12
          cp "$INFO" ci-output/SIGNING-KEY-IMPORTANT.txt
          sha256sum "$OUT" > ci-output/GalerieFotoAnimata-COM-VLADCOINSTAL-APKPURE-2.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: galerie-foto-apkpure-v1-v2-v3
          path: ci-output
          if-no-files-found: error
