name: Build Photo Viewer APK
on:
  push:
    branches:
      - build/photo-viewer-apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build release APK
        working-directory: apk-build/photo-viewer
        run: gradle :app:assembleRelease --stacktrace
      - name: Align, sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output
          PASS="$(openssl rand -hex 16)"
          KEYSTORE="$RUNNER_TEMP/iadulascultarii-release-key.p12"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$PASS" -keypass "$PASS" \
            -alias iadulascultarii -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=Iadul Ascultarii, OU=Android Release, O=Independent Developer, L=Brasov, ST=Brasov, C=RO"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            apk-build/photo-viewer/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/GalerieFotoAnimata-1.0.0-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias iadulascultarii \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out ci-output/GalerieFotoAnimata-1.0.0.apk \
            "$RUNNER_TEMP/GalerieFotoAnimata-1.0.0-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            ci-output/GalerieFotoAnimata-1.0.0.apk > ci-output/APK_VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging \
            ci-output/GalerieFotoAnimata-1.0.0.apk > ci-output/APK_BADGING.txt
          CERT_SHA256="$(grep -m1 'Signer #1 certificate SHA-256 digest:' ci-output/APK_VERIFY.txt | sed 's/.*digest: //')"
          cp "$KEYSTORE" ci-output/iadulascultarii-release-key.p12
          {
            echo 'IMPORTANT - KEEP THESE FILES SAFE'
            echo
            echo 'Package name: com.numeletau.iadulascultarii'
            echo 'APK version: 1.0.0'
            echo 'versionCode: 1'
            echo 'Keystore: iadulascultarii-release-key.p12'
            echo 'Alias: iadulascultarii'
            echo "Keystore password: $PASS"
            echo "Key password: $PASS"
            echo "Certificate SHA-256: $CERT_SHA256"
            echo
            echo 'All future APK updates must be signed with this same keystore/certificate.'
            echo 'If APKPure already has an accepted version signed with a different certificate, this APK cannot update that existing listing.'
          } > ci-output/SIGNING-KEY-IMPORTANT.txt
          sha256sum ci-output/GalerieFotoAnimata-1.0.0.apk > ci-output/GalerieFotoAnimata-1.0.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: galerie-foto-release-package
          path: ci-output
          if-no-files-found: error
