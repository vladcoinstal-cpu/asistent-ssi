name: Build legislation archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/build-legislation-archive.mjs
      - .github/workflows/build-legislation-archive.yml
      - legislation-articles.json
      - legislation-full-acts.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build read-only archive
        run: node scripts/build-legislation-archive.mjs
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legislation-original legislation-program
          if git diff --cached --quiet; then
            echo "No archive changes."
          else
            git commit -m "Build read-only legislation archive"
            git push
          fi
